# Checks every change, and deploys main to Azure Static Web Apps only when all checks pass.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Content validation, type check, engine tests, build
        run: npm run ci
      - name: Reading levels
        run: pip install -r pipeline/requirements.txt && python pipeline/check.py
      - name: End-to-end and accessibility (WCAG 2.2 AA)
        run: npx playwright install --with-deps chromium && npm run e2e
      # Skipped until the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN exists.
      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request' && env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
