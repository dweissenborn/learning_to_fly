# Checks every change. Deploys main to Azure Static Web Apps only when all checks pass.
# The deployment token is a secret of the GitHub environment "production".
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Content validation, type check, engine tests, build
        run: npm run ci
      - name: Content checks (reading levels, coherence, skills; LTF-16)
        run: pip install -r pipeline/requirements.txt && python pipeline/test_checks.py && python pipeline/content_check.py
      - name: End-to-end and accessibility (WCAG 2.2 AA)
        run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://victorious-hill-0c4aff11e.3.azurestaticapps.net
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      # Skipped until the environment secret AZURE_STATIC_WEB_APPS_API_TOKEN exists.
      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          # The family cloud copy's API (managed Azure Functions); it reads COSMOS_CONNECTION from the app's settings.
          api_location: api
