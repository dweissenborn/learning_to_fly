<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learning to Fly</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f1e7; --card: #fffdf8; --ink: #1d2b3a; --accent: #1d6e9e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b2433; --card: #253044; --ink: #eef0f4; --accent: #7cc0e8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 19px/1.6 system-ui, sans-serif; }
    main { max-width: 520px; background: var(--card); border-radius: 20px; padding: 28px; box-shadow: 0 8px 30px rgb(0 0 0 / 0.12); }
    h1 { font-size: 1.5rem; margin: 0 0 0.6rem; }
    a { display: inline-block; margin-top: 0.8rem; padding: 0.7rem 1.3rem; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) { a { color: #10202e; } }
  </style>
</head>
<body>
  <main>
    <h1>This account has not been invited yet</h1>
    <p>Learning to Fly is open only to accounts a grown-up has invited. Ask the grown-up who set it up to send this account an invitation link, or sign in with a different Microsoft account.</p>
    <a href="/.auth/logout?post_logout_redirect_uri=/">Sign in with a different account</a>
  </main>
</body>
</html>
